<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Videoteca</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <h1>Videoteca</h1>

    <section class="controles">
        <label for="buscador">Buscar:</label>
        <input id="buscador" type="search">
        <button id="ordenNombre">Ordenar A-Z</button>
        <button id="ordenNumero">Ordenar por tiempo</button>
        <button id="ordenFecha">Más reciente primero</button>
    </section>

    <form id="formAnadir">
        <h2>Añadir elemento</h2>
        <p>
            <label for="nuevoTitulo">Título:</label>
            <input id="nuevoTitulo" placeholder="Empieza en mayúscula">
            <span id="avisoTitulo" role="alert"></span>
        </p>
        <p><label for="nuevoGenero">Género:</label> <input id="nuevoGenero" required></p>
        <p><label for="nuevaFecha">Fecha:</label> <input id="nuevaFecha" type="date" required></p>
        <p><label for="nuevaSinopsis">Sinopsis:</label> <input id="nuevaSinopsis" required></p>
        <p>
            <label for="nuevoTipo">Tipo:</label>
            <select id="nuevoTipo">
                <option>Película</option>
                <option>Serie</option>
            </select>
        </p>
        <p>
            <label for="nuevaDuracion">Duración (min):</label>
            <input id="nuevaDuracion" type="number" min="1" required>
        </p>
        <button type="submit">Añadir</button>
    </form>

    <h2>Catálogo</h2>
    <p id="contador"></p>
    <p id="sinResultados" hidden>No se encontraron elementos.</p>
    <section id="estadisticas"></section>
    <section id="catalogo"></section>

    <script type="module" src="js/interfaz.js"></script>
</body>

</html>
